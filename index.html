<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Boutique Demo - Accueil</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
        <header>
        <h1>Boutique Demo</h1>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="#catalogue">Catalogue</a></li>
            <li><a href="#panier">Panier</a></li>
            <li><a href="connexion.html">Connexion</a></li>
        </ul>
    </header>
    <main>
        <section id="bienvenue">
            <h2>Bienvenue</h2>
            <p>Découvrez notre sélection de produits.</p>
        </section>

        <section id="catalogue">
            <h2>Catalogue</h2>
            
            <div class="zone-filtres">
                <input type="text" id="barre-recherche" placeholder="Rechercher...">
                <select id="choix-categorie">
                    <option value="toutes">Toutes catégories</option>
                    <option value="Mode">Mode</option>
                    <option value="Accessoires">Accessoires</option>
                </select>
            </div>

            <div id="charge_produit"></div>
        </section>

        <section id="panier">
            <h2>Votre Panier</h2>
            <table border="1">
                <thead>
                    <tr>
                        <th>Article</th>
                        <th>Prix unitaire</th>
                        <th>Quantité</th>
                        <th>Sous-total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="lignes-du-panier"></tbody>
            </table>

            <p>Total général : <span id="total-panier">0</span> XAF</p>
            <button id="vider-panier">Vider le panier</button>
        </section>
    </main>

    <script src="shop.js"></script>
</body>
</html>
