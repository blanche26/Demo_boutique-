<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Boutique Demo</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header>
        <h1>Boutique Demo</h1>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="index.html#catalogue">Catalogue</a></li>
            <li><a href="index.html#panier">Panier</a></li>
            <li><a href="#">Connexion</a></li>
        </ul>
    </header>

    <main>
        <div class="boite-connexion">
            <h2>Espace Connexion</h2>
            
            <form onsubmit="verifierConnexion(event)">
                <div class="groupe-champ">
                    <label for="email">Email :</label>
                    <input type="text" id="email" placeholder="Ex: nom@gmail.com" required>
                </div>

                <div class="groupe-champ">
                    <label for="mdp">Mot de passe :</label>
                    <input type="password" id="mdp" placeholder="Votre mot de passe" required>
                </div>

                <button type="submit" class="bouton-connexion">Se connecter</button>
            </form>

            <div id="message-retour" style="margin-top: 20px; text-align: center; font-weight: bold;"></div>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
